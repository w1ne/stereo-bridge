plugins { id 'com.android.application' }
android {
 namespace 'app.stereobridge.handoff'
 compileSdk 36
 ndkVersion '28.2.13676358'
 externalNativeBuild { cmake { path file('../../app/src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/micSources').get().asFile
 defaultConfig {
  applicationId 'app.stereobridge.handoff.test'
  minSdk 29
  targetSdk 36
  versionCode 1
  versionName '0.1-probe'
  testInstrumentationRunner 'app.stereobridge.handoff.RecoveryProbe'
  ndk { abiFilters 'arm64-v8a' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyMicSources', Sync) {
 from('../../app/src/main/java') { include 'app/stereobridge/mic/**' }
 into layout.buildDirectory.dir('generated/micSources')
}
tasks.named('preBuild').configure { dependsOn('copyMicSources') }
dependencies { testImplementation 'junit:junit:4.13.2' }
