plugins { id 'com.android.application' }
def signingPath = System.getenv('STEREO_BRIDGE_SIGNING_PROPERTIES')
def releaseKeys = new Properties()
if (signingPath) file(signingPath).withInputStream { releaseKeys.load(it) }

android {
 namespace 'app.stereobridge'
 buildFeatures { resValues true }
 sourceSets { main { java.srcDir '../third_party/libadb/src/main/java' } }
 compileSdk 36
 ndkVersion '28.2.13676358'
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 defaultConfig { applicationId 'app.stereobridge'; minSdk 31; targetSdk 36; versionCode 2; versionName '0.1.0-rc2'; ndk { abiFilters 'arm64-v8a' } }
 signingConfigs {
  if (signingPath) release { storeFile file(releaseKeys['storeFile']); storePassword releaseKeys['storePassword']; keyAlias releaseKeys['keyAlias']; keyPassword releaseKeys['keyPassword'] }
 }
 buildTypes { debug { applicationIdSuffix '.debug'; resValue 'string', 'app_name', 'Stereo Bridge Dev' }; release { resValue 'string', 'app_name', 'Stereo Bridge'; debuggable false; minifyEnabled false; if (signingPath) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.annotation:annotation:1.9.1'
 implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
 if (System.getenv('STEREO_BRIDGE_SPAKE2_AAR')) implementation files(System.getenv('STEREO_BRIDGE_SPAKE2_AAR'))
 else implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
 implementation 'org.conscrypt:conscrypt-android:2.5.3'
 implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
 testImplementation 'junit:junit:4.13.2'
}
