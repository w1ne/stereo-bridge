plugins { id 'com.android.application' }
def signingPath = System.getenv('STEREO_BRIDGE_SIGNING_PROPERTIES')
def releaseKeys = new Properties()
if (signingPath) file(signingPath).withInputStream { releaseKeys.load(it) }

android {
 namespace 'app.stereobridge'
 buildFeatures { resValues true; buildConfig true }

 compileSdk 36
 ndkVersion '28.2.13676358'
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 defaultConfig { applicationId 'app.stereobridge'; minSdk 29; targetSdk 36; versionCode 7; versionName '0.2.0-offline-rc4'; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' } }
 signingConfigs {
  if (signingPath) release { storeFile file(releaseKeys['storeFile']); storePassword releaseKeys['storePassword']; keyAlias releaseKeys['keyAlias']; keyPassword releaseKeys['keyPassword'] }
 }
 buildTypes { debug { ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86_64' }; applicationIdSuffix '.debug'; resValue 'string', 'app_name', 'Stereo Bridge Dev' }; release { resValue 'string', 'app_name', 'Stereo Bridge'; debuggable false; minifyEnabled false; if (signingPath) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

// Root policy is the source for the offline, readable in-app copy.
def privacyAssets = layout.buildDirectory.dir('generated/privacyAssets')
android.sourceSets.main.assets.srcDir(privacyAssets.get().asFile)
tasks.register('generatePrivacyAsset', Copy) {
 from(rootProject.file('PRIVACY.md'))
 into(privacyAssets)
 rename { 'privacy.md' }
}
tasks.named('preBuild').configure { dependsOn('generatePrivacyAsset') }
